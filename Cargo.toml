[workspace]
members = ["crates/jam-protocol", "crates/jam-server", "crates/jam-client", "crates/jam-collector"]
resolver = "2"

[workspace.package]
version = "1.0.6-beta"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/mielecarmine/Virtual-Jam-Hub"
homepage = "https://github.com/mielecarmine/Virtual-Jam-Hub#readme"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = true
codegen-units = 1
