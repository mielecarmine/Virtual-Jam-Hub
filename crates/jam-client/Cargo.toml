[package]
name = "jam-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
jam-protocol = { path = "../jam-protocol" }
cpal = "0.15.3"
ctrlc = "3.4"
rtrb = "0.3.2"
opus = "0.4"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"

[target.'cfg(target_os = "windows")'.dependencies]
cpal = { version = "0.15.3", features = ["asio"] }

[lints]
workspace = true

[dev-dependencies]
jam-server = { path = "../jam-server" }

[[example]]
name = "net_bench"
path = "src/net_bench.rs"
test = true
