name: Release installers
on:
  push:
    branches: ['codex/release-*']
    tags: ['1.*-beta-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-amd64
          - os: windows-2022
            platform: windows-x64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev cmake
      - name: Windows prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV
      - name: Read and validate version
        shell: bash
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "$VERSION"; fi
      - run: cargo fmt --check
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked --workspace
      - name: Linux installer and installation smoke test
        if: runner.os == 'Linux'
        run: bash packaging/linux.sh "$VERSION"
      - name: macOS installer and installation smoke test
        if: runner.os == 'macOS'
        run: bash packaging/macos.sh "$VERSION" "$(uname -m)"
      - name: Windows installer and installation smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$env:VERSION" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $setup = Get-Item "dist/*-setup.exe"
          $install = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Installer failed' }
          & "$env:LOCALAPPDATA\Programs\Virtual Jam\jam-client.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed client failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist
      - name: Publish complete prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          sha256sum * > SHA256SUMS.txt
          cd ..
          gh release create "$TAG" dist/* --verify-tag --prerelease --title "Virtual Jam $TAG" --notes-file packaging/RELEASE-NOTES.md
