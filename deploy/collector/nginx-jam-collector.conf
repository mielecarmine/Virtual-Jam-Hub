# Nginx reverse proxy for jam-collector on 185.198.245.40
# Place in /etc/nginx/sites-available/jam-collector and symlink to sites-enabled.

limit_req_zone $binary_remote_addr zone=jam_collector_limit:10m rate=30r/m;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 185.198.245.40;

    ssl_certificate     /etc/virtual-jam/tls/fullchain.pem;
    ssl_certificate_key /etc/virtual-jam/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    client_body_timeout 10s;

    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/api/v1/logs(/(server|client))?$ {
        limit_req zone=jam_collector_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location / {
        return 404;
    }
}
